name: flag-service

on:
  push:
    branches: [main]
    paths:
      - "services/flag-service/**"
      - ".github/workflows/flag-service.yml"
  pull_request:
    paths:
      - "services/flag-service/**"
      - ".github/workflows/flag-service.yml"

permissions:
  contents: read
  id-token: write

env:
  SERVICE: flag-service
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster-dev/flag-service

jobs:  build:
    name: build e teste
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flag-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # o codigo fornecido nao traz testes, entao a verificacao minima e compilar os modulos
      - run: python -m compileall -q .

      - run: python -m pytest -q
        continue-on-error: true

  lint:
    name: analise estatica
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flag-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install flake8

      - run: flake8 --max-line-length=120 --extend-ignore=E501,W503 .

  sast:
    name: SAST com bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flag-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install bandit

      - run: bandit -r . -ll
  sca:
    name: SCA com Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # relatorio informativo, nao bloqueia
      - name: inventario de vulnerabilidades
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: services/flag-service
          severity: HIGH,CRITICAL
          exit-code: "0"

      # portao do enunciado: dependencia com vulnerabilidade CRITICA derruba o pipeline
      - name: portao de critico
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: services/flag-service
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  image:
    name: imagem e push
    needs: [build, lint, sast, sca]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # credencial temporaria por OIDC, sem access key guardada no repositorio
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build da imagem
        run: docker build -t local/${{ env.SERVICE }}:${{ github.sha }} services/${{ env.SERVICE }}

      # segundo portao: a imagem pronta e escaneada antes de existir no registro
      - name: scan da imagem
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: image
          image-ref: local/${{ env.SERVICE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: push para o ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag local/${SERVICE}:${GITHUB_SHA} ${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}
          docker push ${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}

      - name: atualiza a tag no repositorio de gitops
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone git@github.com:mjrafael/togglemaster-gitops.git /tmp/gitops
          cd /tmp/gitops

          sed -i "s#image: .*/${ECR_REPOSITORY}:.*#image: ${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}#" apps/${SERVICE}/deployment.yaml

          git config user.name "togglemaster ci"
          git config user.email "ci@togglemaster.invalid"
          git add apps/${SERVICE}/deployment.yaml
          git diff --cached --quiet || git commit -m "atualiza ${SERVICE} para ${GITHUB_SHA}"
          git push
